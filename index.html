const qs=[
{n:1,ae:'AE5 / EF06CI05 — organização celular',kind:'mc',text:'Durante uma aula, estudantes observaram uma bactéria, uma célula de folha e uma célula da mucosa da boca. As imagens tinham formas diferentes, mas a professora pediu que identificassem uma ideia comum às três observações. Qual conclusão é sustentada pela teoria celular?',photo:'cells',opts:['A) A célula é a unidade básica dos seres vivos, embora existam diferenças entre os tipos celulares.','B) A presença de núcleo é obrigatória em todos os seres vivos observados.','C) Organismos formados por uma célula não realizam as funções necessárias à vida.','D) Células vegetais e animais são iguais porque apresentam exatamente as mesmas estruturas.'],ans:'A'},
{n:2,ae:'AE5 / EF06CI05 — investigação científica',kind:'mc',text:'Uma turma preparou uma lâmina com células de uma folha e comparou o que via a olho nu com o que aparecia no microscópio. Além de ampliar a imagem, qual é a importância científica desse instrumento nessa investigação?',photo:'scope',opts:['A) Ele transforma uma célula em um órgão para facilitar a observação.','B) Ele permite observar estruturas, registrar evidências e comparar resultados que não seriam percebidos a olho nu.','C) Ele identifica sozinho a espécie e a função de cada estrutura sem necessidade de análise.','D) Ele substitui a formulação de hipóteses porque toda imagem microscópica já é uma explicação.'],ans:'B'},
{n:3,ae:'AE5 / EF06CI05 — fotossíntese',kind:'mc',text:'Uma planta mantida em um local iluminado apresentou células com organelas verdes. No modelo 3D, essas organelas aparecem com pilhas internas de membranas. Qual relação entre estrutura e função está mais adequada?',photo:'chloroplastMicro',opts:['A) As pilhas internas armazenam o material genético que controla a célula.','B) Os cloroplastos captam energia luminosa e participam da produção de matéria orgânica na fotossíntese.','C) Os cloroplastos realizam a digestão de partículas e eliminam resíduos da célula.','D) As membranas internas são responsáveis principalmente pela produção de anticorpos.'],ans:'B'},
{n:4,ae:'AE5 / EF06CI05 — células procariontes',kind:'mc',text:'No modelo 3D, o material genético da bactéria aparece em uma região do citoplasma, sem um compartimento semelhante ao núcleo da célula vegetal. Qual interpretação explica melhor essa diferença?',photo:'bacteria',opts:['A) A bactéria não possui material genético, por isso depende de uma célula vegetal.','B) A bactéria é pluricelular, pois seu material genético fica espalhado em várias partes.','C) A bactéria é eucarionte, pois toda célula com membrana possui núcleo.','D) A bactéria é procarionte: possui material genético, mas não tem núcleo delimitado por membrana.'],ans:'D'},
{n:5,ae:'AE5 / EF06CI05 — fungos',kind:'mc',text:'Em um alimento armazenado em local úmido, foram observadas estruturas semelhantes às do modelo 3D: células ovais com brotamentos e filamentos ramificados. Qual análise relaciona corretamente a imagem ao grupo dos fungos?',photo:'fungus',opts:['A) Leveduras podem ser unicelulares e hifas formam estruturas filamentosas; fungos são eucariontes e podem atuar como decompositores.','B) Leveduras e hifas são partes de uma bactéria e realizam fotossíntese para produzir o próprio alimento.','C) Todo fungo é um vírus porque depende de outro organismo para obter matéria orgânica.','D) Hifas são órgãos de animais microscópicos e os brotamentos indicam reprodução exclusivamente sexuada.'],ans:'A'},
{n:6,ae:'AE5 / EF06CI05 — protozoários',kind:'mc',text:'Ao analisar uma amostra de água doce, a turma encontrou um organismo unicelular com cílios, representado no modelo 3D. Qual evidência ajuda a classificá-lo como protozoário e não como vírus?',photo:'protist',opts:['A) Ele é obrigatoriamente formado por muitos tecidos e órgãos microscópicos.','B) Ele não possui material genético e só consegue existir dentro de uma célula hospedeira.','C) Ele é uma célula eucarionte geralmente unicelular, com estruturas próprias para realizar funções vitais.','D) Ele produz seu alimento apenas por apresentar uma parede celular rígida.'],ans:'C'},
{n:7,ae:'AE5 / EF06CI05 — agentes infecciosos',kind:'mc',text:'Depois de uma enchente, uma unidade de saúde registrou aumento de casos de diarreia. A investigação encontrou esgoto misturado à água de consumo. Qual explicação considera a cadeia de transmissão sem afirmar que todo microrganismo é perigoso?',photo:'protistMicro',opts:['A) A enchente transforma todas as bactérias ambientais em vírus causadores de doenças.','B) A contaminação pode transportar agentes infecciosos até a água ou os alimentos; interromper essa via reduz o risco, embora existam microrganismos não patogênicos.','C) A presença de qualquer microrganismo na água prova que ela sempre causará doença em todas as pessoas.','D) O problema ocorre apenas porque a água fica turva; a aparência é suficiente para medir todos os riscos.'],ans:'B'},
{n:8,ae:'Saúde e saneamento — transmissão',kind:'mc',text:'Em uma comunidade sem coleta de esgoto, uma criança bebeu água de um córrego próximo às casas. Qual sequência representa uma possível transmissão fecal-oral?',photo:'water',opts:['A) Microrganismo no esgoto → tratamento adequado → água potável → ausência de exposição.','B) Microrganismo no solo seco → luz solar → vacinação → formação de anticorpos.','C) Microrganismo em uma folha → fotossíntese → oxigênio → transmissão respiratória obrigatória.','D) Fezes contaminadas → água ou alimento → ingestão → entrada do agente no organismo.'],ans:'D'},
{n:9,ae:'AE5 / EF06CI05 — vírus',kind:'essay',text:'O modelo 3D mostra partículas virais se ligando à membrana de uma célula hospedeira. Explique por que os vírus dependem da célula para se multiplicar e relacione essa característica a uma medida de prevenção.',photo:'virus',hint:'Explique que o vírus utiliza estruturas e processos da célula hospedeira para produzir novas partículas. Relacione a prevenção à doença e à via de transmissão, como vacinação, ventilação ou higiene.'},
{n:10,ae:'Saúde e saneamento — análise de situação',kind:'essay',text:'Uma família armazena água sem tampa, não possui rede de esgoto e costuma consumir alimentos sem higienização. Analise duas possíveis vias de transmissão de microrganismos nessa situação e proponha duas medidas de saneamento ou higiene que interrompam a cadeia.',photo:'sanitation',hint:'Diferencie água/alimento contaminado, contato com mãos ou superfícies e outras vias. Justifique por que cada medida reduz a exposição.'},
];

};
function didactic(type){const i=imageInfo[type]||imageInfo.cheek;return `<img src="${i.src}" alt="${i.alt}" loading="lazy"><p class="photo-note">${i.caption}</p>`}
function render(){document.getElementById('questions').innerHTML=qs.map(q=>`<article class="question"><span class="ae">${q.ae}</span><h3>${q.n}. ${q.kind==='mc'?'Questão objetiva':'Questão dissertativa'}</h3><p>${q.text}</p><div class="figure">${didactic(q.photo)}</div>${q.kind==='mc'?`<div class="options">${q.opts.map(o=>`<label class="option"><input type="radio" name="q${q.n}" value="${o[0]}"><span>${o}</span></label>`).join('')}</div>`:`<div class="hint">${q.hint}</div><textarea name="q${q.n}" placeholder="Digite sua resposta aqui..."></textarea>`}</article>`).join('')}
const turma=document.getElementById('turma'),nome=document.getElementById('nome'),ra=document.getElementById('ra'),chamada=document.getElementById('chamada'),email=document.getElementById('email'),dataRealizacao=document.getElementById('dataRealizacao');dataRealizacao.value=new Intl.DateTimeFormat('pt-BR').format(new Date());const rosterByTurma=Object.fromEntries(Object.entries(roster).map(([k,v])=>[k.replace(/\s/g,''),v]));turma.onchange=()=>{nome.disabled=!turma.value;const alunos=rosterByTurma[turma.value.replace(/\s/g,'')]||[];nome.innerHTML='<option value="">Selecione seu nome</option>'+alunos.map(x=>`<option value="${x.nome}" data-ra="${x.ra}">${x.nome}</option>`).join('');ra.value='';chamada.value='';email.value=''};nome.onchange=()=>{const a=(rosterByTurma[turma.value.replace(/\s/g,'')]||[]).find(x=>x.nome===nome.value);ra.value=a?.ra||'';chamada.value=a?.chamada||'';email.value=a?.email||''};
document.getElementById('questions').addEventListener('change',e=>{if(e.target.matches('input[type=radio]')){document.querySelectorAll('input[name="'+e.target.name+'"]').forEach(i=>i.closest('.option')?.classList.remove('selected'));e.target.closest('.option')?.classList.add('selected')}});
document.getElementById('quiz').onsubmit=e=>{e.preventDefault();const s=document.getElementById('status');if(!turma.value||!nome.value){s.className='status error';s.textContent='Selecione a turma e o nome antes de enviar.';s.style.display='block';return}const respostas={};qs.forEach(q=>{if(q.kind==='mc')respostas[q.n]=document.querySelector(`input[name=q${q.n}]:checked`)?.value||'';else respostas[q.n]=document.querySelector(`[name=q${q.n}]`).value.trim()});if(Object.values(respostas).some(v=>!v)){s.className='status error';s.textContent='Responda todas as questões antes de enviar.';s.style.display='block';return}const payload={turma:turma.value,nome:nome.value,ra:ra.value,chamada:chamada.value,email:email.value,dataRealizacao:dataRealizacao.value,respostas};s.className='status';s.textContent='Enviando...';s.style.display='block';if(!SCRIPT_URL){s.className='status success';s.innerHTML='Atividade validada localmente. Para registrar as respostas na planilha, configure a URL do Apps Script no campo SCRIPT_URL do arquivo index.html.';return}fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(()=>{s.className='status success';s.innerHTML='Respostas enviadas para a planilha. A correção será calculada no Apps Script.';document.querySelectorAll('input,textarea,select,button').forEach(x=>x.disabled=true)}).catch(err=>{s.className='status error';s.textContent='Não foi possível registrar: '+err.message})};render();
</script></body></html>
