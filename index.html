<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atividade de Ciências — 6º ano — 3º bimestre</title>
<style>
:root{--blue1:#b9e7ff;--blue2:#07528f;--ink:#123047;--green:#126b42;--red:#b83232;--card:linear-gradient(135deg,#d9f3ff 0%,#8ec8ef 43%,#07528f 150%)}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:linear-gradient(145deg,#eaf8ff,#c8e7f7 45%,#eff8fc);min-height:100vh}
header{background:linear-gradient(120deg,#06345e,#0b78b8);color:white;padding:28px 18px;text-align:center;box-shadow:0 5px 16px #06345e55}header h1{font-size:clamp(1.2rem,3vw,2rem);margin:0 0 5px}header h2{font-size:1.1rem;margin:0;font-weight:normal}
main{max-width:1060px;margin:auto;padding:22px 14px 60px}.student-box,.question{border-radius:20px;box-shadow:0 8px 18px #07436b3b;border:1px solid #ffffff99}.student-box{background:#fff;padding:18px;margin-bottom:20px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.field label{display:block;font-weight:bold;margin:0 0 5px}.field select,.field input{width:100%;padding:12px;border:2px solid #8ac5e6;border-radius:10px;font-size:1rem;background:white}.field input[readonly]{background:#eef7fb}.question{background:var(--card);padding:20px;margin:18px 0;position:relative;overflow:hidden}.question h3{margin:0 0 9px;color:#063b69}.question p{font-size:1.06rem;line-height:1.45}.ae{display:inline-block;background:#ffffffbb;border-radius:18px;padding:4px 10px;font-size:.78rem;font-weight:bold;margin-bottom:10px}.figure{background:#effaffcc;border-radius:14px;padding:9px;text-align:center;margin:12px auto;max-width:610px}.figure svg{max-width:100%;height:150px}.options{display:grid;gap:10px;margin-top:14px}.option{position:relative;display:flex;align-items:center;gap:10px;background:#f7fdff;color:#063b69;border:2px solid #71acd0;border-radius:13px;padding:14px;cursor:pointer;font-weight:bold;box-shadow:0 5px 0 #5087a8,0 8px 13px #064a7340;transition:.12s}.option:hover{transform:translateY(-1px)}.option:active,.option.selected{transform:translateY(5px);box-shadow:0 1px 0 #0c4b32;background:var(--green);border-color:#0b472d;color:white}.option input{accent-color:white;transform:scale(1.2)}textarea{width:100%;min-height:105px;border:2px solid #70acd0;border-radius:12px;padding:12px;font:inherit;resize:vertical;background:#f8fdff}.hint{font-size:.9rem;background:#ffffff9c;padding:9px;border-radius:10px}.actions{text-align:center;margin-top:24px}.btn{background:linear-gradient(#15915b,#07552f);color:white;border:0;border-radius:14px;padding:16px 30px;font-size:1.1rem;font-weight:bold;cursor:pointer;box-shadow:0 6px 0 #043a21}.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #043a21}.status{margin:18px auto;padding:15px;border-radius:12px;text-align:center;display:none;font-weight:bold}.success{background:#c8f2d8;color:#07552f}.error{background:#ffd6d6;color:#8d1e1e}.required{color:#9d2020}.small{font-size:.86rem;color:#456}
@media(max-width:760px){.student-box{grid-template-columns:1fr}.question{padding:15px}.figure svg{height:120px}}
</style>
</head>
<body>
<header><h1>E.E. PROFª WANDA MASCAGNI DE SÁ</h1><h2>Ciências — 6º Ano — Atividade do 3º bimestre</h2></header>
<main>
<section class="student-box">
<div class="field"><label for="turma">Turma <span class="required">*</span></label><select id="turma"><option value="">Selecione primeiro a turma</option><option>6º Ano A</option><option>6º Ano C</option></select></div>
<div class="field"><label for="nome">Nome <span class="required">*</span></label><select id="nome" disabled><option>Selecione a turma antes</option></select></div>
<div class="field"><label for="ra">RA</label><input id="ra" readonly placeholder="Carregado automaticamente"></div>
</section>
<form id="quiz">
<div id="questions"></div>
<div class="actions"><button class="btn" type="submit">Enviar atividade</button><div id="status" class="status"></div></div>
</form>
</main>
<script>
const roster={"6ºAno A":[{"nome":"ALÍCIA DE SOUZA SIQUEIRA","ra":"1254829957"},{"nome":"AMANDA SALDANHA CAVALCANTE","ra":"1164988931"},{"nome":"ANA BÁRBARA SAÚGO DE OLIVEIRA","ra":"1223588488"},{"nome":"DANIEL DA SILVA TAVARES","ra":"1214885093"},{"nome":"ISABELY SHIBASAKI FERREIRA","ra":"1165060267"},{"nome":"JOÃO INÁCIO DO NASCIMENTO RODRIGUES","ra":"1219420281"},{"nome":"JOAO PIERRE DA SILVA","ra":"116526142X"},{"nome":"JULLIA VITORIA ALAMBERT GOMES","ra":"1211907764"},{"nome":"KAMRAN RASEKH","ra":"1245963533"},{"nome":"KAYQUE VINICIOS DA SILVA","ra":"1165272295"},{"nome":"LORENA EMMELINE MENDES LEFEVRE","ra":"1216217324"},{"nome":"LUAN HENRIQUE DE ALMEIDA TAVARES","ra":"1236900662"},{"nome":"MURILLO CARVALHO SALES","ra":"1214863504"},{"nome":"NICOLY FERREIRA GONCALVES","ra":"123924088"},{"nome":"SARAH CAVALCANTE CANDIDO DA SILVA","ra":"116764243"},{"nome":"SOFIA SOARES DE OLIVEIRA","ra":"1229656303"},{"nome":"VINICÍUS ARTHUR ALVES DA SILVA","ra":"1214798986"},{"nome":"WALLISON LEONARDO DE JESUS LESSA","ra":"1158916486"},{"nome":"EDUARDO ANTONIO LAMBERT GONÇALVES","ra":"1254890658"},{"nome":"FERNANDA MEDEIROS FANTINI","ra":"116503850X"},{"nome":"JOAO PIETRO ROCHA OLIVEIRA","ra":"1249838769"},{"nome":"JOÃO VICTOR FERNANDES MORAES","ra":"1144549474"},{"nome":"LEONARDO FURINI FERNANDES JUNIOR","ra":"1158852332"},{"nome":"ALESSANDRA SALGADO DA SILVA","ra":"1164984354"},{"nome":"ROBERT LUCAS MARTINS FERREIRA","ra":"116520583X"},{"nome":"ALICIA SALGADO DA SILVA","ra":"1164987562"},{"nome":"ALICE CANALLE MAGALHÃES","ra":"1214828711"}],"6ºAno C":[{"nome":"AGATHA RODRIGUES MIRANDA","ra":"121488538X"},{"nome":"ANA LETÍCIA MARTINS DA SILVA","ra":"1214940778"},{"nome":"ARTHUR DEIVID DA SILVA FARIAS","ra":"1214870016"},{"nome":"CLARA JAZMIN URDAPILLETA GONZALEZ","ra":"1221516528"},{"nome":"EMILY COSTA PEREIRA","ra":"1155071074"},{"nome":"FELIPE BARROS DE FREITAS","ra":"1158794058"},{"nome":"HELOISA NEVES DA SILVA","ra":"1150787399"},{"nome":"ISABELA SEVERA RAULINO","ra":"1158811949"},{"nome":"JOAO VITOR BARBOSA PONTES","ra":"1158827349"},{"nome":"LAURAH APARECIDA CANDIDO DE OLIVEIRA","ra":"1216216174"},{"nome":"MATHEUS DUARTE DA SILVA","ra":"1214874605"},{"nome":"ROSA MARIA OLIVEIRA ALMEIDA","ra":"1214935175"},{"nome":"SARAH LIVIA NUNES NASCIMENTO","ra":"1229767241"},{"nome":"TALITA VITORIA VIEIRA NUNES","ra":"1223579098"},{"nome":"VICTOR EDUARDO DOS SANTOS","ra":"1158913047"},{"nome":"VITOR HUGO BRAZ GOMES","ra":"1164683524"},{"nome":"LORENNA ANDRADE DE OLIVEIRA","ra":"1165284844"},{"nome":"MARIA EDUARDA ARAUJO GARRIDO","ra":"1254805813"},{"nome":"RAISSA MATHIAS ANDRADE","ra":"1214774891"},{"nome":"UELITON VIEIRA DA SILVA","ra":"1214900872"},{"nome":"VALENTINA DOS SANTOS CORREA","ra":"1158447383"},{"nome":"MARIA VITORIA ALMEIDA SANTOS","ra":"122357970"},{"nome":"CATARYNA DOS SANTOS","ra":"121484716X"},{"nome":"ANA CLARA CORREA PINTO","ra":"1164990445"},{"nome":"GUSTAVO HENRIQUE SANTOS MALAQUIAS","ra":"1158805044"},{"nome":"SOFFIA NICOLY ALVES FIDELES","ra":"1158905245"},{"nome":"DAYLLA CRISTINE RODRIGUES DOS SANTOS VIEIRA","ra":"1159854403"}]};
const SCRIPT_URL = ""; // Cole aqui a URL do Aplicativo da Web do Apps Script para registrar respostas.
const qs=[
{n:1,ae:'AE5 / EF06CI05',kind:'mc',text:'Ao observar uma gota de água ao microscópio, uma estudante percebeu estruturas muito pequenas. Considerando a teoria celular, qual conclusão é adequada?',fig:'cell',opts:['A) Apenas animais possuem células.','B) A célula é a unidade estrutural e funcional dos seres vivos.','C) As células surgem somente quando um organismo cresce.','D) Seres unicelulares não são seres vivos.'],ans:'B'},
{n:2,ae:'AE5 / EF06CI05',kind:'mc',text:'O desenvolvimento do microscópio modificou a História da Ciência porque permitiu aos pesquisadores:',fig:'scope',opts:['A) Criar células artificiais sem observar seres vivos.','B) Medir a massa de todos os organismos.','C) Observar estruturas celulares que não são visíveis a olho nu.','D) Provar que todos os seres vivos são pluricelulares.'],ans:'C'},
{n:3,ae:'AE5 / EF06CI05',kind:'mc',text:'Uma célula possui uma estrutura que controla a entrada e a saída de substâncias, uma região onde ocorrem muitas reações e um compartimento que contém o material genético. A sequência correta é:',fig:'parts',opts:['A) Membrana, citoplasma e núcleo.','B) Núcleo, membrana e parede celular.','C) Citoplasma, núcleo e cloroplasto.','D) Cloroplasto, citoplasma e membrana.'],ans:'A'},
{n:4,ae:'AE5 / EF06CI05',kind:'mc',text:'Em uma investigação, foram comparadas uma bactéria e uma célula animal. A diferença celular mais importante entre elas é que:',fig:'prok',opts:['A) A bactéria não possui material genético.','B) A célula animal não possui membrana.','C) A bactéria é sempre pluricelular.','D) A célula animal apresenta núcleo organizado; a bactéria, não.'],ans:'D'},
{n:5,ae:'AE5 / EF06CI05',kind:'mc',text:'Uma planta consegue produzir seu alimento principalmente graças a uma organela que capta luz. Essa organela e sua função são:',fig:'plant',opts:['A) Núcleo — realizar a digestão.','B) Cloroplasto — participar da fotossíntese.','C) Ribossomo — armazenar água.','D) Membrana — produzir luz.'],ans:'B'},
{n:6,ae:'AE5 / EF06CI05',kind:'mc',text:'Uma equipe encontrou seres microscópicos com diferentes formas: cocos, bacilos e vibriões. O grupo que melhor corresponde a essa descrição é:',fig:'microbes',opts:['A) Bactérias, seres geralmente unicelulares e procariontes.','B) Vírus, organismos formados por tecidos.','C) Fungos, seres sempre pluricelulares e sem material genético.','D) Protozoários, seres sem célula.'],ans:'A'},
{n:7,ae:'AE6 / EF06CI06',kind:'mc',text:'Em um modelo do corpo humano, várias células semelhantes formam uma estrutura que desempenha uma função específica; estruturas diferentes trabalham juntas. A ordem correta dos níveis é:',fig:'levels',opts:['A) Célula → tecido → órgão → sistema → organismo.','B) Órgão → célula → sistema → tecido → organismo.','C) Sistema → órgão → tecido → célula → organismo.','D) Tecido → organismo → célula → órgão → sistema.'],ans:'A'},
{n:8,ae:'AE5 / EF06CI05',kind:'essay',text:'Explique, com suas palavras, por que a membrana, o citoplasma e o núcleo são importantes para o funcionamento de uma célula.',fig:'parts',hint:'Escreva pelo menos três ideias: controle de substâncias, reações celulares e material genético.'},
{n:9,ae:'AE5 / EF06CI05',kind:'essay',text:'Compare uma célula vegetal com uma célula animal. Cite uma estrutura presente nas plantas e explique sua função.',fig:'plant',hint:'Relacione cloroplasto e fotossíntese ou parede celular e sustentação.'},
{n:10,ae:'AE6 / EF06CI06',kind:'essay',text:'Explique como células especializadas podem formar tecidos, órgãos e sistemas em um organismo multicelular.',fig:'levels',hint:'Use a ideia de organização em níveis e dê um exemplo, como células musculares e tecido muscular.'}
];
function svg(type){const base=`<svg viewBox="0 0 600 160" role="img" aria-label="Ilustração científica relacionada à questão"><rect width="600" height="160" rx="15" fill="#d9f4ff"/>`;let x='';if(type==='cell'||type==='parts')x=`<circle cx="220" cy="80" r="58" fill="#9bd7f3" stroke="#07528f" stroke-width="5"/><circle cx="220" cy="80" r="21" fill="#496fc0"/><circle cx="190" cy="50" r="7" fill="#ef8759"/><circle cx="260" cy="52" r="7" fill="#ef8759"/><circle cx="270" cy="105" r="7" fill="#ef8759"/><text x="330" y="55" fill="#07528f" font-weight="bold">membrana</text><text x="330" y="83" fill="#07528f" font-weight="bold">núcleo</text><text x="330" y="111" fill="#07528f" font-weight="bold">citoplasma</text>`;else if(type==='scope')x=`<rect x="230" y="105" width="150" height="18" rx="8" fill="#07528f"/><path d="M285 105V55h45l25 50M270 55h65" fill="none" stroke="#126b42" stroke-width="14"/><circle cx="310" cy="48" r="25" fill="#89c9e8" stroke="#07528f" stroke-width="6"/><text x="80" y="55" fill="#07528f" font-weight="bold">lentes</text><text x="80" y="90" fill="#07528f" font-weight="bold">observação</text>`;else if(type==='prok')x=`<ellipse cx="200" cy="80" rx="95" ry="48" fill="#f4d77c" stroke="#8b6515" stroke-width="5"/><path d="M140 72q35-30 70 0t70 0" fill="none" stroke="#8b6515" stroke-width="5"/><circle cx="190" cy="80" r="9" fill="#9d4938"/><circle cx="380" cy="80" r="55" fill="#b8e5f7" stroke="#07528f" stroke-width="5"/><circle cx="380" cy="80" r="20" fill="#496fc0"/><text x="105" y="145" fill="#07528f" font-weight="bold">bactéria</text><text x="345" y="145" fill="#07528f" font-weight="bold">animal</text>`;else if(type==='plant')x=`<rect x="190" y="25" width="180" height="110" rx="15" fill="#b6e2a0" stroke="#276b3d" stroke-width="6"/><ellipse cx="240" cy="70" rx="17" ry="10" fill="#23844c"/><ellipse cx="300" cy="100" rx="17" ry="10" fill="#23844c"/><circle cx="280" cy="72" r="20" fill="#496fc0"/><text x="405" y="65" fill="#07528f" font-weight="bold">cloroplastos</text><text x="405" y="94" fill="#07528f" font-weight="bold">fotossíntese</text>`;else if(type==='microbes')x=`<circle cx="180" cy="80" r="38" fill="#e98a87"/><rect x="260" y="48" width="95" height="64" rx="32" fill="#edbd65"/><path d="M420 55q50-35 65 20t-45 35" fill="none" stroke="#8b56a6" stroke-width="22"/><text x="145" y="145" fill="#07528f" font-weight="bold">cocos</text><text x="275" y="145" fill="#07528f" font-weight="bold">bacilos</text><text x="430" y="145" fill="#07528f" font-weight="bold">vibriões</text>`;else x=`<circle cx="100" cy="80" r="28" fill="#78b9de"/><path d="M130 80h65" stroke="#07528f" stroke-width="5" marker-end="url(#a)"/><rect x="220" y="50" width="85" height="60" rx="10" fill="#91d6ae"/><path d="M310 80h65" stroke="#07528f" stroke-width="5" marker-end="url(#a)"/><rect x="400" y="43" width="90" height="74" rx="10" fill="#f2c86d"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#07528f"/></marker></defs><text x="75" y="145" fill="#07528f" font-weight="bold">célula</text><text x="235" y="145" fill="#07528f" font-weight="bold">tecido</text><text x="420" y="145" fill="#07528f" font-weight="bold">órgão</text>`;return base+x+'</svg>'}
function render(){document.getElementById('questions').innerHTML=qs.map(q=>`<article class="question"><span class="ae">${q.ae}</span><h3>${q.n}. ${q.kind==='mc'?'Questão objetiva':'Questão dissertativa'}</h3><p>${q.text}</p><div class="figure">${svg(q.fig)}</div>${q.kind==='mc'?`<div class="options">${q.opts.map(o=>`<label class="option"><input type="radio" name="q${q.n}" value="${o[0]}"><span>${o}</span></label>`).join('')}</div>`:`<div class="hint">${q.hint}</div><textarea name="q${q.n}" placeholder="Digite sua resposta aqui..."></textarea>`}</article>`).join('')}
const turma=document.getElementById('turma'),nome=document.getElementById('nome'),ra=document.getElementById('ra');turma.onchange=()=>{nome.disabled=!turma.value;nome.innerHTML='<option value="">Selecione seu nome</option>'+(roster[turma.value]||[]).map(x=>`<option value="${x.nome}" data-ra="${x.ra}">${x.nome}</option>`).join('');ra.value=''};nome.onchange=()=>ra.value=nome.selectedOptions[0]?.dataset.ra||'';
document.getElementById('quiz').onsubmit=e=>{e.preventDefault();const s=document.getElementById('status');if(!turma.value||!nome.value){s.className='status error';s.textContent='Selecione a turma e o nome antes de enviar.';s.style.display='block';return}const respostas={};qs.forEach(q=>{if(q.kind==='mc')respostas[q.n]=document.querySelector(`input[name=q${q.n}]:checked`)?.value||'';else respostas[q.n]=document.querySelector(`[name=q${q.n}]`).value.trim()});if(Object.values(respostas).some(v=>!v)){s.className='status error';s.textContent='Responda todas as questões antes de enviar.';s.style.display='block';return}const payload={turma:turma.value,nome:nome.value,ra:ra.value,respostas};s.className='status';s.textContent='Enviando...';s.style.display='block';if(!SCRIPT_URL){s.className='status success';s.innerHTML='Atividade carregada corretamente. Para registrar as respostas, configure a URL do Apps Script no campo SCRIPT_URL do arquivo index.html.';return}fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(()=>{s.className='status success';s.innerHTML='Respostas enviadas para a planilha. A correção será calculada no Apps Script.';document.querySelectorAll('input,textarea,select,button').forEach(x=>x.disabled=true)}).catch(err=>{s.className='status error';s.textContent='Não foi possível registrar: '+err.message})};render();
</script></body></html>
