<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atividade de Ciências — 6º ano — 3º bimestre</title>
<style>
:root{--blue1:#b9e7ff;--blue2:#07528f;--ink:#123047;--green:#126b42;--red:#b83232;--card:linear-gradient(135deg,#d9f3ff 0%,#8ec8ef 43%,#07528f 150%)}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:linear-gradient(145deg,#eaf8ff,#c8e7f7 45%,#eff8fc);min-height:100vh}
header{background:linear-gradient(120deg,#06345e,#0b78b8);color:white;padding:28px 18px;text-align:center;box-shadow:0 5px 16px #06345e55}header h1{font-size:clamp(1.2rem,3vw,2rem);margin:0 0 5px}header h2{font-size:1.1rem;margin:0;font-weight:normal}
main{max-width:1060px;margin:auto;padding:22px 14px 60px}.student-box,.question{border-radius:20px;box-shadow:0 8px 18px #07436b3b;border:1px solid #ffffff99}.student-box{background:#fff;padding:18px;margin-bottom:20px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.field label{display:block;font-weight:bold;margin:0 0 5px}.field select,.field input{width:100%;padding:12px;border:2px solid #8ac5e6;border-radius:10px;font-size:1rem;background:white}.field input[readonly]{background:#eef7fb}.question{background:var(--card);padding:20px;margin:18px 0;position:relative;overflow:hidden}.question h3{margin:0 0 9px;color:#063b69}.question p{font-size:1.06rem;line-height:1.45}.ae{display:inline-block;background:#ffffffbb;border-radius:18px;padding:4px 10px;font-size:.78rem;font-weight:bold;margin-bottom:10px}.figure{background:#effaffcc;border-radius:14px;padding:9px;text-align:center;margin:12px auto;max-width:610px}.figure img{max-width:100%;max-height:220px;width:auto;border-radius:10px;display:block;margin:auto}.figure small{display:block;font-size:.75rem;margin-top:5px;color:#31536a}.figure img{max-width:100%;max-height:220px;width:auto;border-radius:10px;display:block;margin:auto}.figure small{display:block;font-size:.75rem;margin-top:5px;color:#31536a}.figure svg{max-width:100%;height:150px}.options{display:grid;gap:10px;margin-top:14px}.option{position:relative;display:flex;align-items:center;gap:10px;background:#f7fdff;color:#063b69;border:2px solid #71acd0;border-radius:13px;padding:14px;cursor:pointer;font-weight:bold;box-shadow:0 5px 0 #5087a8,0 8px 13px #064a7340;transition:.12s}.option:hover{transform:translateY(-1px)}.option:active,.option.selected{transform:translateY(5px);box-shadow:0 1px 0 #0c4b32;background:var(--green);border-color:#0b472d;color:white}.option input{accent-color:white;transform:scale(1.2)}textarea{width:100%;min-height:105px;border:2px solid #70acd0;border-radius:12px;padding:12px;font:inherit;resize:vertical;background:#f8fdff}.hint{font-size:.9rem;background:#ffffff9c;padding:9px;border-radius:10px}.actions{text-align:center;margin-top:24px}.btn{background:linear-gradient(#15915b,#07552f);color:white;border:0;border-radius:14px;padding:16px 30px;font-size:1.1rem;font-weight:bold;cursor:pointer;box-shadow:0 6px 0 #043a21}.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #043a21}.status{margin:18px auto;padding:15px;border-radius:12px;text-align:center;display:none;font-weight:bold}.success{background:#c8f2d8;color:#07552f}.error{background:#ffd6d6;color:#8d1e1e}.required{color:#9d2020}.small{font-size:.86rem;color:#456}
@media(max-width:760px){.figure img{max-width:100%;height:auto}.student-box{grid-template-columns:1fr}.question{padding:15px}.figure svg{height:120px}}
</style>
</head>
<body>
<header><h1>E.E. PROFª WANDA MASCAGNI DE SÁ</h1><h2>Ciências — 6º Ano — Atividade do 3º bimestre</h2></header>
<main>
<section class="student-box">
<div class="field"><label for="turma">Turma <span class="required">*</span></label><select id="turma"><option value="">Selecione primeiro a turma</option><option>6º Ano A</option><option>6º Ano C</option></select></div>
<div class="field"><label for="nome">Nome <span class="required">*</span></label><select id="nome" disabled><option>Selecione a turma antes</option></select></div>
<div class="field"><label for="ra">RA</label><input id="ra" readonly placeholder="Carregado automaticamente"></div>
</section>
<form id="quiz">
<div id="questions"></div>
<div class="actions"><button class="btn" type="submit">Enviar atividade</button><div id="status" class="status"></div></div>
</form>
</main>
<script>
const roster={"6ºAno A":[{"nome":"ALÍCIA DE SOUZA SIQUEIRA","ra":"1254829957"},{"nome":"AMANDA SALDANHA CAVALCANTE","ra":"1164988931"},{"nome":"ANA BÁRBARA SAÚGO DE OLIVEIRA","ra":"1223588488"},{"nome":"DANIEL DA SILVA TAVARES","ra":"1214885093"},{"nome":"ISABELY SHIBASAKI FERREIRA","ra":"1165060267"},{"nome":"JOÃO INÁCIO DO NASCIMENTO RODRIGUES","ra":"1219420281"},{"nome":"JOAO PIERRE DA SILVA","ra":"116526142X"},{"nome":"JULLIA VITORIA ALAMBERT GOMES","ra":"1211907764"},{"nome":"KAMRAN RASEKH","ra":"1245963533"},{"nome":"KAYQUE VINICIOS DA SILVA","ra":"1165272295"},{"nome":"LORENA EMMELINE MENDES LEFEVRE","ra":"1216217324"},{"nome":"LUAN HENRIQUE DE ALMEIDA TAVARES","ra":"1236900662"},{"nome":"MURILLO CARVALHO SALES","ra":"1214863504"},{"nome":"NICOLY FERREIRA GONCALVES","ra":"123924088"},{"nome":"SARAH CAVALCANTE CANDIDO DA SILVA","ra":"116764243"},{"nome":"SOFIA SOARES DE OLIVEIRA","ra":"1229656303"},{"nome":"VINICÍUS ARTHUR ALVES DA SILVA","ra":"1214798986"},{"nome":"WALLISON LEONARDO DE JESUS LESSA","ra":"1158916486"},{"nome":"EDUARDO ANTONIO LAMBERT GONÇALVES","ra":"1254890658"},{"nome":"FERNANDA MEDEIROS FANTINI","ra":"116503850X"},{"nome":"JOAO PIETRO ROCHA OLIVEIRA","ra":"1249838769"},{"nome":"JOÃO VICTOR FERNANDES MORAES","ra":"1144549474"},{"nome":"LEONARDO FURINI FERNANDES JUNIOR","ra":"1158852332"},{"nome":"ALESSANDRA SALGADO DA SILVA","ra":"1164984354"},{"nome":"ROBERT LUCAS MARTINS FERREIRA","ra":"116520583X"},{"nome":"ALICIA SALGADO DA SILVA","ra":"1164987562"},{"nome":"ALICE CANALLE MAGALHÃES","ra":"1214828711"}],"6ºAno C":[{"nome":"AGATHA RODRIGUES MIRANDA","ra":"121488538X"},{"nome":"ANA LETÍCIA MARTINS DA SILVA","ra":"1214940778"},{"nome":"ARTHUR DEIVID DA SILVA FARIAS","ra":"1214870016"},{"nome":"CLARA JAZMIN URDAPILLETA GONZALEZ","ra":"1221516528"},{"nome":"EMILY COSTA PEREIRA","ra":"1155071074"},{"nome":"FELIPE BARROS DE FREITAS","ra":"1158794058"},{"nome":"HELOISA NEVES DA SILVA","ra":"1150787399"},{"nome":"ISABELA SEVERA RAULINO","ra":"1158811949"},{"nome":"JOAO VITOR BARBOSA PONTES","ra":"1158827349"},{"nome":"LAURAH APARECIDA CANDIDO DE OLIVEIRA","ra":"1216216174"},{"nome":"MATHEUS DUARTE DA SILVA","ra":"1214874605"},{"nome":"ROSA MARIA OLIVEIRA ALMEIDA","ra":"1214935175"},{"nome":"SARAH LIVIA NUNES NASCIMENTO","ra":"1229767241"},{"nome":"TALITA VITORIA VIEIRA NUNES","ra":"1223579098"},{"nome":"VICTOR EDUARDO DOS SANTOS","ra":"1158913047"},{"nome":"VITOR HUGO BRAZ GOMES","ra":"1164683524"},{"nome":"LORENNA ANDRADE DE OLIVEIRA","ra":"1165284844"},{"nome":"MARIA EDUARDA ARAUJO GARRIDO","ra":"1254805813"},{"nome":"RAISSA MATHIAS ANDRADE","ra":"1214774891"},{"nome":"UELITON VIEIRA DA SILVA","ra":"1214900872"},{"nome":"VALENTINA DOS SANTOS CORREA","ra":"1158447383"},{"nome":"MARIA VITORIA ALMEIDA SANTOS","ra":"122357970"},{"nome":"CATARYNA DOS SANTOS","ra":"121484716X"},{"nome":"ANA CLARA CORREA PINTO","ra":"1164990445"},{"nome":"GUSTAVO HENRIQUE SANTOS MALAQUIAS","ra":"1158805044"},{"nome":"SOFFIA NICOLY ALVES FIDELES","ra":"1158905245"},{"nome":"DAYLLA CRISTINE RODRIGUES DOS SANTOS VIEIRA","ra":"1159854403"}]};
const SCRIPT_URL = ""; // Cole aqui a URL do Aplicativo da Web do Apps Script para registrar respostas.
const qs=[
{n:1,ae:'AE5 / EF06CI05 — aulas 1 e 2',kind:'mc',text:'Durante uma aula prática, a turma observou uma fotografia de células da bochecha humana obtida ao microscópio. Embora as células estejam organizadas de modo diferente em cada tecido, todas realizam funções essenciais para manter o organismo vivo. A observação ajuda a compreender a teoria celular. Qual conclusão interpreta corretamente essa situação?',photo:'cheek',opts:['A) Todo ser vivo precisa ser formado por muitos órgãos para possuir células.','B) A célula é a unidade estrutural e funcional dos seres vivos; alguns organismos têm uma célula e outros têm muitas.','C) O microscópio transforma uma célula em um órgão visível.','D) As células aparecem apenas em animais, pois plantas e bactérias não são seres vivos.'],ans:'B'},
{n:2,ae:'AE5 / EF06CI05 — aula 2',kind:'mc',text:'No século XVII, pesquisadores aperfeiçoaram instrumentos com lentes e passaram a observar estruturas que não podiam ser vistas a olho nu. Hoje, em um laboratório escolar, o microscópio óptico permite que estudantes investiguem tecidos e microrganismos. Qual foi a principal contribuição histórica desse instrumento?',photo:'scope',opts:['A) Permitir a observação e a descrição de células, tecidos e microrganismos, ampliando o conhecimento científico.','B) Produzir células novas a partir de lentes e iluminação.','C) Substituir todas as experiências e observações por imagens prontas.','D) Demonstrar que somente seres humanos possuem organização celular.'],ans:'A'},
{n:3,ae:'AE5 / EF06CI05 — aula 3',kind:'mc',text:'Uma estudante analisou células da mucosa da boca e registrou três componentes: uma película que delimita a célula, uma região interna onde ocorrem diversas reações e uma estrutura que abriga o material genético. Considerando essas observações, qual alternativa relaciona corretamente componente e função?',photo:'cheek',opts:['A) Membrana: controla trocas; citoplasma: abriga reações; núcleo: contém o material genético.','B) Núcleo: controla a entrada de água; membrana: realiza fotossíntese; citoplasma: é o DNA.','C) Citoplasma: é uma parede rígida; núcleo: produz luz; membrana: forma tecidos.','D) Membrana: existe somente em células vegetais; núcleo: está ausente em células animais.'],ans:'A'},
{n:4,ae:'AE5 / EF06CI05 — aula 4',kind:'mc',text:'Em uma investigação sobre microrganismos, a turma comparou uma bactéria com uma célula animal. A bactéria possui material genético, mas esse material não fica delimitado por um núcleo organizado como ocorre na célula animal. Com base nessa característica, é correto afirmar que:',photo:'bacteria',opts:['A) A bactéria é eucarionte porque possui material genético.','B) A célula animal é procarionte porque é microscópica.','C) Bactérias e animais possuem exatamente a mesma organização interna.','D) A bactéria é procarionte e a célula animal é eucarionte.'],ans:'D'},
{n:5,ae:'AE5 / EF06CI05 — aulas 5 e 6',kind:'mc',text:'Uma folha exposta à luz apresenta células vegetais com estruturas verdes. Em uma experiência, parte da folha foi coberta e, depois, comparada com a parte iluminada. A região verde e iluminada produziu mais alimento para a planta. Qual organela está diretamente relacionada a esse processo?',photo:'plant',opts:['A) Núcleo, responsável por armazenar água.','B) Cloroplasto, que participa da fotossíntese utilizando energia luminosa.','C) Membrana, que transforma luz em tecido.','D) Lisossomo, que realiza a fotossíntese.'],ans:'B'},
{n:6,ae:'AE5 / EF06CI05 — aulas 9 a 13',kind:'mc',text:'Ao examinar uma amostra de água, os estudantes encontraram organismos microscópicos e discutiram como diferentes grupos podem participar dos ecossistemas e também estar relacionados à saúde. Uma bactéria pode ter formato de esfera, bastão ou vírgula. Qual afirmação está correta?',photo:'bacteria',opts:['A) Cocos, bacilos e vibriões são formas de bactérias, seres geralmente unicelulares e procariontes.','B) Bactérias são sempre vírus, pois não possuem nenhuma estrutura celular.','C) Todo microrganismo é um fungo pluricelular e causa doenças.','D) Protozoários, fungos e bactérias possuem obrigatoriamente tecidos e órgãos.'],ans:'A'},
{n:7,ae:'AE6 / EF06CI06 — aulas 15 e 16',kind:'mc',text:'Uma equipe montou um modelo do corpo humano para explicar por que uma lesão em muitas células pode comprometer um tecido e, em seguida, afetar um órgão. No modelo, células semelhantes se agrupam, órgãos trabalham juntos e vários sistemas compõem o organismo. Qual sequência representa essa organização do menor para o maior nível?',photo:'tissue',opts:['A) Célula → tecido → órgão → sistema → organismo.','B) Órgão → célula → tecido → sistema → organismo.','C) Sistema → tecido → célula → órgão → organismo.','D) Tecido → órgão → célula → organismo → sistema.'],ans:'A'},
{n:8,ae:'AE5 / EF06CI05 — aulas 3, 5 e 6',kind:'essay',text:'Em uma prática, você observou células animais e vegetais. Explique, em um pequeno texto, como a membrana, o citoplasma e o núcleo participam da vida celular. Em seguida, cite uma estrutura que diferencia a célula vegetal da animal e explique sua função.',photo:'plant',hint:'Relacione controle de substâncias, reações celulares, material genético e uma estrutura vegetal, como cloroplasto ou parede celular.'},
{n:9,ae:'AE5 / EF06CI05 — aulas 9 a 14',kind:'essay',text:'Imagine que uma comunidade passou a apresentar aumento de doenças após consumir água sem tratamento. Explique como bactérias, fungos, protozoários ou vírus podem estar relacionados à saúde e indique uma medida de saneamento básico que ajude a reduzir a transmissão.',photo:'microbes',hint:'Diferencie os grupos quando possível e relacione água tratada, coleta de esgoto, lixo ou higiene à prevenção.'},
{n:10,ae:'AE6 / EF06CI06 — aulas 15 e 16',kind:'essay',text:'Durante uma atividade, o professor mostrou uma imagem de tecido formado por muitas células organizadas. Explique por que um organismo multicelular não é apenas um conjunto desorganizado de células. Use a sequência célula–tecido–órgão–sistema–organismo e dê um exemplo.',photo:'tissue',hint:'Mostre que células especializadas trabalham em conjunto e que os níveis de organização dependem uns dos outros.'}
];
function photo(type){const imgs={cheek:['https://upload.wikimedia.org/wikipedia/commons/3/36/Cheekcells_stained.jpg','Células da bochecha humana observadas ao microscópio, 500× — Mulletsrokk, CC BY-SA 3.0'],scope:['https://upload.wikimedia.org/wikipedia/commons/6/61/Laboratory_Optical_Microscope.jpg','Microscópio óptico de laboratório — Aliva Sahoo, CC BY-SA 4.0'],plant:['https://upload.wikimedia.org/wikipedia/commons/8/8c/C%C3%A9lulas_de_flores_en_turgencia_Aumento_total-_400x.jpg','Micrografia de células vegetais em turgência, 400× — BioGenZambrano, CC BY-SA 4.0'],bacteria:['https://upload.wikimedia.org/wikipedia/commons/5/52/Bacillus_subtilis_2.jpg','Bacillus subtilis em coloração de Gram — Dr Graham Beards, CC BY-SA 4.0'],microbes:['https://upload.wikimedia.org/wikipedia/commons/5/52/Bacillus_subtilis_2.jpg','Micrografia real de bactéria usada para discutir microrganismos e saúde — Dr Graham Beards, CC BY-SA 4.0'],tissue:['https://upload.wikimedia.org/wikipedia/commons/3/36/Cheekcells_stained.jpg','Tecido epitelial humano observado ao microscópio, 500× — Mulletsrokk, CC BY-SA 3.0']}[type];return `<img src="${imgs[0]}" alt="${imgs[1]}" loading="lazy"><small>${imgs[1]}</small>`}

function render(){document.getElementById('questions').innerHTML=qs.map(q=>`<article class="question"><span class="ae">${q.ae}</span><h3>${q.n}. ${q.kind==='mc'?'Questão objetiva':'Questão dissertativa'}</h3><p>${q.text}</p><div class="figure">${photo(q.photo)}</div>${q.kind==='mc'?`<div class="options">${q.opts.map(o=>`<label class="option"><input type="radio" name="q${q.n}" value="${o[0]}"><span>${o}</span></label>`).join('')}</div>`:`<div class="hint">${q.hint}</div><textarea name="q${q.n}" placeholder="Digite sua resposta aqui..."></textarea>`}</article>`).join('')}
const turma=document.getElementById('turma'),nome=document.getElementById('nome'),ra=document.getElementById('ra');turma.onchange=()=>{nome.disabled=!turma.value;nome.innerHTML='<option value="">Selecione seu nome</option>'+(roster[turma.value]||[]).map(x=>`<option value="${x.nome}" data-ra="${x.ra}">${x.nome}</option>`).join('');ra.value=''};nome.onchange=()=>ra.value=nome.selectedOptions[0]?.dataset.ra||'';
document.getElementById('questions').addEventListener('change',e=>{if(e.target.matches('input[type=radio]')){document.querySelectorAll('input[name="'+e.target.name+'"]').forEach(i=>i.closest('.option')?.classList.remove('selected'));e.target.closest('.option')?.classList.add('selected')}});
document.getElementById('questions').addEventListener('change',e=>{if(e.target.matches('input[type=radio]')){document.querySelectorAll('input[name="'+e.target.name+'"]').forEach(i=>i.closest('.option')?.classList.remove('selected'));e.target.closest('.option')?.classList.add('selected')}});
document.getElementById('quiz').onsubmit=e=>{e.preventDefault();const s=document.getElementById('status');if(!turma.value||!nome.value){s.className='status error';s.textContent='Selecione a turma e o nome antes de enviar.';s.style.display='block';return}const respostas={};qs.forEach(q=>{if(q.kind==='mc')respostas[q.n]=document.querySelector(`input[name=q${q.n}]:checked`)?.value||'';else respostas[q.n]=document.querySelector(`[name=q${q.n}]`).value.trim()});if(Object.values(respostas).some(v=>!v)){s.className='status error';s.textContent='Responda todas as questões antes de enviar.';s.style.display='block';return}const payload={turma:turma.value,nome:nome.value,ra:ra.value,respostas};s.className='status';s.textContent='Enviando...';s.style.display='block';if(!SCRIPT_URL){s.className='status success';s.innerHTML='Atividade carregada corretamente. Para registrar as respostas, configure a URL do Apps Script no campo SCRIPT_URL do arquivo index.html.';return}fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(()=>{s.className='status success';s.innerHTML='Respostas enviadas para a planilha. A correção será calculada no Apps Script.';document.querySelectorAll('input,textarea,select,button').forEach(x=>x.disabled=true)}).catch(err=>{s.className='status error';s.textContent='Não foi possível registrar: '+err.message})};render();
</script></body></html>
